{{- /* Light / dark / system theme switch. Pass true to show text labels
       (mobile nav drawer); the header uses icons only. Behaviour lives in
       js/theme-switch.js; state comes from <html data-theme-pref>. */ -}}
{{- $labels := . -}}
<div class="theme-switch" role="group" aria-label="Colour theme">
	<button type="button" data-theme-set="light" aria-pressed="false" title="Light theme"{{ if not $labels }} aria-label="Light theme"{{ end }}>{{ partial "icon.html" "sun" }}{{ if $labels }}<span>Light</span>{{ end }}</button>
	<button type="button" data-theme-set="dark" aria-pressed="false" title="Dark theme"{{ if not $labels }} aria-label="Dark theme"{{ end }}>{{ partial "icon.html" "moon" }}{{ if $labels }}<span>Dark</span>{{ end }}</button>
	<button type="button" data-theme-set="system" aria-pressed="false" title="Match system setting"{{ if not $labels }} aria-label="Match system setting"{{ end }}>{{ partial "icon.html" "monitor" }}{{ if $labels }}<span>System</span>{{ end }}</button>
</div>

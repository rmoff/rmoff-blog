{{- /* Light / dark / system theme switch, labelled, for the mobile nav drawer.
       The desktop header uses the compact theme-menu.html. Behaviour lives in
       js/theme-switch.js; state comes from <html data-theme-pref>. */ -}}
<div class="theme-switch" role="group" aria-label="Colour theme">
	<button type="button" data-theme-set="light" aria-pressed="false">{{ partial "icon.html" "sun" }}<span>Light</span></button>
	<button type="button" data-theme-set="dark" aria-pressed="false">{{ partial "icon.html" "moon" }}<span>Dark</span></button>
	<button type="button" data-theme-set="system" aria-pressed="false">{{ partial "icon.html" "monitor" }}<span>System</span></button>
</div>

{{- /* Compact theme control for the desktop header: one icon button showing the
       current choice (via <html data-theme-pref>, see redesign.css) that opens
       a Light / Dark / System menu. Behaviour lives in js/theme-switch.js. */ -}}
<div class="theme-menu">
	<button type="button" class="theme-menu-button" aria-haspopup="true" aria-expanded="false" aria-controls="theme-menu-list" aria-label="Theme" title="Theme">
		<span class="theme-menu-icon" data-theme-icon="light">{{ partial "icon.html" "sun" }}</span>
		<span class="theme-menu-icon" data-theme-icon="dark">{{ partial "icon.html" "moon" }}</span>
		<span class="theme-menu-icon" data-theme-icon="system">{{ partial "icon.html" "monitor" }}</span>
	</button>
	<div class="theme-menu-list" id="theme-menu-list" role="menu" aria-label="Theme" hidden>
		<button type="button" role="menuitemradio" aria-checked="false" data-theme-set="light" tabindex="-1">{{ partial "icon.html" "sun" }}<span>Light</span></button>
		<button type="button" role="menuitemradio" aria-checked="false" data-theme-set="dark" tabindex="-1">{{ partial "icon.html" "moon" }}<span>Dark</span></button>
		<button type="button" role="menuitemradio" aria-checked="false" data-theme-set="system" tabindex="-1">{{ partial "icon.html" "monitor" }}<span>System</span></button>
	</div>
</div>

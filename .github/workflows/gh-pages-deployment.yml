name: Build & deploy live site

on:
  push:
    branches:
     - main
#   schedule:
#     # Run on the hour
#     - cron: '0 * * * *'

# One deploy at a time. Two merges close together used to race: both built, and the
# second push to rmoff.github.io was rejected because the first had just landed. Now the
# later one waits. If several queue up, only the most recently queued one is kept (normally
# the latest merge, which has everything); re-running an old deploy can still publish old content.
concurrency:
  group: deploy-live-site
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v3

    - name: Build Docker image
      run: docker build -t rmoff-blog:local .

    - name: Build reveal.js presentations (requires local asciidoctor)
      run: |
        sudo apt-get update
        sudo apt-get install -y ruby-dev
        sudo gem install asciidoctor asciidoctor-revealjs
        ./build-slides.sh

    - name: Build Hugo site with Docker
      run: |
        docker run --rm \
          -v $(pwd):/src \
          rmoff-blog:local \
          --destination public

    - name: Build Pagefind search index
      run: npx --yes pagefind@1.5.2 --site public  # pinned; bump deliberately (search.html + search-palette.js use its JS API)

    - name: Deploy
      uses: peaceiris/actions-gh-pages@v3
      with:
        deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
        external_repository: rmoff/rmoff.github.io
        publish_branch: master
        # Publish exactly what this build produces, so files from old builds don't pile up (they took the
        # site past GitHub Pages' 1 GB limit and its deploys timed out). `cname` writes the CNAME file that
        # keep_files used to preserve; posts whose address changed carry `aliases:` for their old URLs.
        cname: rmoff.net

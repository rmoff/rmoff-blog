# Swaps the real cuttings for the fixture cuttings in a build:
#   hugo --config config.yaml,tests/fixtures/cuttings/config.yaml
module:
  mounts:
  - source: content
    target: content
    files:
    - "! cuttings/20*/**"
  - source: tests/fixtures/cuttings/content
    target: content
  - source: static
    target: assets
  - source: static
    target: static
